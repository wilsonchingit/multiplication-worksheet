<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplication Worksheet Maker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f0f8ff;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .form-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .form-group {
      flex: 1;
      min-width: 200px;
      margin: 10px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .worksheet {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      padding: 20px;
      border-top: 2px dashed #ccc;
      margin-top: 20px;
      font-size: 18px;
    }
    .column {
      flex: 1;
      min-width: 200px;
    }
    .question {
      margin-bottom: 10px;
    }
    .download-btn {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧠 Multiplication Worksheet Maker</h1>

    <div class="form-section">
      <div class="form-group">
        <label for="questionCount">Number of Questions:</label>
        <input type="number" id="questionCount" min="1" value="50">
      </div>
      <div class="form-group">
        <label>Table Range:</label>
        <span>2 ➡️ 12</span>
      </div>
      <div class="form-group">
        <label>&nbsp;</label>
        <button id="generateBtn">Generate Worksheet</button>
      </div>
    </div>

    <div class="worksheet" id="worksheetPreview">
      <!-- Questions will appear here -->
    </div>

    <div class="download-btn">
      <button id="downloadBtn">⭳ Download PDF</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const preview = document.getElementById('worksheetPreview');

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestions(count) {
      const questions = [];
      for (let i = 0; i < count; i++) {
        const a = getRandomInt(2, 12);
        const b = getRandomInt(2, 12);
        questions.push(`${i + 1}. ${a} x ${b} = _______`);
      }
      return questions;
    }

    function renderWorksheet(questions) {
      preview.innerHTML = '';
      let column;
      for (let i = 0; i < questions.length; i++) {
        if (i % 20 === 0) {
          column = document.createElement('div');
          column.className = 'column';
          preview.appendChild(column);
        }
        const div = document.createElement('div');
        div.className = 'question';
        div.textContent = questions[i];
        column.appendChild(div);
      }
    }

    generateBtn.addEventListener('click', () => {
      const count = parseInt(document.getElementById('questionCount').value, 10);
      const questions = generateQuestions(count);
      renderWorksheet(questions);
    });

    downloadBtn.addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      html2canvas(preview).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const pdf = new jsPDF('p', 'pt', 'a4');
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();

        const imgProps = pdf.getImageProperties(imgData);
        const ratio = pageWidth / imgProps.width;
        const imgHeight = imgProps.height * ratio;

        pdf.addImage(imgData, 'PNG', 0, 20, pageWidth, imgHeight);
        pdf.save('multiplication-worksheet.pdf');
      });
    });
  </script>
</body>
</html>
